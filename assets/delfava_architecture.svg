<svg xmlns="http://www.w3.org/2000/svg" width="1076" height="538" viewBox="0 0 1000 500" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Architecture of the CTT maze agent and the five-stage turnover cycle</title>
<rect width="1000" height="500" fill="#fcfcfb"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6e69"/></marker></defs>
<text x="40.0" y="36.0" font-size="19" fill="#1f1f1f" text-anchor="start" font-weight="normal">The agent: a stable LSTM backbone feeding a plastic turnover layer</text>
<text x="40.0" y="72.0" font-size="13" fill="#686868" text-anchor="start" font-weight="bold" letter-spacing="1">FORWARD PASS, EVERY STEP</text>
<rect x="30.0" y="88.0" width="164.0" height="112.0" rx="8" fill="#efefec" stroke="#a9a8a2" stroke-width="2"/>
<text x="112.0" y="118.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">Observation</text>
<text x="112.0" y="142.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">31 values</text>
<text x="112.0" y="161.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">5x5 window, goal,</text>
<text x="112.0" y="180.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">last move</text>
<rect x="224.0" y="88.0" width="164.0" height="112.0" rx="8" fill="#e9f1fc" stroke="#2a78d6" stroke-width="2"/>
<text x="306.0" y="118.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">Encoder</text>
<text x="306.0" y="142.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">2 x Linear + ReLU</text>
<text x="306.0" y="161.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">256 units</text>
<rect x="418.0" y="88.0" width="164.0" height="112.0" rx="8" fill="#e9f1fc" stroke="#2a78d6" stroke-width="2"/>
<text x="500.0" y="118.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">LSTM cell</text>
<text x="500.0" y="142.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">256 hidden units</text>
<text x="500.0" y="161.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">recurrent memory</text>
<rect x="612.0" y="88.0" width="164.0" height="112.0" rx="8" fill="#fdf0e9" stroke="#eb6834" stroke-width="2"/>
<text x="694.0" y="118.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">Plastic layer</text>
<text x="694.0" y="142.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">384 slots</text>
<text x="694.0" y="161.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">256 active at start</text>
<text x="694.0" y="180.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">kill and birth zone</text>
<rect x="806.0" y="88.0" width="164.0" height="112.0" rx="8" fill="#efefec" stroke="#a9a8a2" stroke-width="2"/>
<text x="888.0" y="118.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">Heads</text>
<text x="888.0" y="142.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">policy: 4 moves</text>
<text x="888.0" y="161.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">value: 1 number</text>
<path d="M197.0,144.0 L219.0,144.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M391.0,144.0 L413.0,144.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M585.0,144.0 L607.0,144.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M779.0,144.0 L801.0,144.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="224.0" y1="216.0" x2="582.0" y2="216.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="403.0" y="238.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">Stable backbone: never turned over</text>
<text x="224.0" y="316.0" font-size="13" fill="#686868" text-anchor="start" font-weight="bold" letter-spacing="1">TURNOVER CYCLE, EVERY 500 UPDATES AFTER A 1,000-UPDATE WARM-UP</text>
<rect x="30.0" y="330.0" width="164.0" height="112.0" rx="8" fill="#fdf0e9" stroke="#eb6834" stroke-width="2"/>
<text x="112.0" y="360.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">1  Score</text>
<text x="112.0" y="384.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">importance minus</text>
<text x="112.0" y="403.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">0.5 x redundancy</text>
<rect x="224.0" y="330.0" width="164.0" height="112.0" rx="8" fill="#fdf0e9" stroke="#eb6834" stroke-width="2"/>
<text x="306.0" y="360.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">2  Kill</text>
<text x="306.0" y="384.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">lowest scores die;</text>
<text x="306.0" y="403.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">top 10% and newborns</text>
<text x="306.0" y="422.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">are protected</text>
<rect x="418.0" y="330.0" width="164.0" height="112.0" rx="8" fill="#fdf0e9" stroke="#eb6834" stroke-width="2"/>
<text x="500.0" y="360.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">3  Birth</text>
<text x="500.0" y="384.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">clone a donor from</text>
<text x="500.0" y="403.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">the top 20%, add</text>
<text x="500.0" y="422.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">small noise</text>
<rect x="612.0" y="330.0" width="164.0" height="112.0" rx="8" fill="#fdf0e9" stroke="#eb6834" stroke-width="2"/>
<text x="694.0" y="360.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">4  Gate</text>
<text x="694.0" y="384.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">newborn output</text>
<text x="694.0" y="403.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">ramps from 0 to 1</text>
<text x="694.0" y="422.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">over 1,000 updates</text>
<rect x="806.0" y="330.0" width="164.0" height="112.0" rx="8" fill="#fdf0e9" stroke="#eb6834" stroke-width="2"/>
<text x="888.0" y="360.0" font-size="17" fill="#1f1f1f" text-anchor="middle" font-weight="bold">5  Homeostasis</text>
<text x="888.0" y="384.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">rescale activity,</text>
<text x="888.0" y="403.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">then a short</text>
<text x="888.0" y="422.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">replay step</text>
<path d="M197.0,386.0 L219.0,386.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M391.0,386.0 L413.0,386.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M585.0,386.0 L607.0,386.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M779.0,386.0 L801.0,386.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M664.0,203.0 L664.0,274.0 L112.0,274.0 L112.0,326.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="232.0" y="266.0" font-size="13" fill="#686868" text-anchor="start" font-weight="normal">reads each unit&#x27;s activity and gradient</text>
<path d="M888.0,328.0 L888.0,274.0 L724.0,274.0 L724.0,205.0" fill="none" stroke="#6f6e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="896.0" y="296.0" font-size="13" fill="#686868" text-anchor="start" font-weight="normal">rewrites units</text>
<text x="896.0" y="313.0" font-size="13" fill="#686868" text-anchor="start" font-weight="normal">and gates</text>
<text x="40.0" y="482.0" font-size="14" fill="#454545" text-anchor="start" font-weight="normal">Only the kill and birth fractions change between conditions. Every other setting, and the parameter count, is identical.</text>
</svg>

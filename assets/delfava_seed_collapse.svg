<circle cx="596.8" cy="266.0" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="962.0" y="271.0" font-size="14" fill="#1f1f1f" text-anchor="end" font-weight="normal">69.4% → 68.3%</text>
<text x="40.0" y="315.0" font-size="14" fill="#1f1f1f" text-anchor="start" font-weight="normal">Death-only</text>
<line x1="276.3" y1="310.0" x2="360.2" y2="310.0" stroke="#5040ad" stroke-width="2" stroke-opacity="0.45"/>

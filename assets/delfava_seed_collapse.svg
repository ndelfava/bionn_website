<svg xmlns="http://www.w3.org/2000/svg" width="1076" height="506" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Regime solve rates at 13x13 with three seeds and with eight seeds</title>
<rect width="1000" height="470" fill="#fcfcfb"/>
<text x="40.0" y="36.0" font-size="19" fill="#1f1f1f" text-anchor="start" font-weight="normal">Three seeds suggested a regime effect; eight seeds removed it</text>
<circle cx="46.0" cy="66.0" r="6" fill="#fcfcfb"/><circle cx="46.0" cy="66.0" r="5" fill="#fcfcfb" stroke="#454545" stroke-width="2"/>

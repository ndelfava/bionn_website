<text x="40.0" y="100.0" font-size="13" fill="#686868" text-anchor="start" font-weight="normal">Pooled regime</text>
<text x="962.0" y="100.0" font-size="13" fill="#686868" text-anchor="end" font-weight="normal">3 seeds → 8 seeds</text>
<line x1="210.0" y1="108.0" x2="210.0" y2="406.0" stroke="#e6e6e2" stroke-width="1"/>
<line x1="292.9" y1="108.0" x2="292.9" y2="406.0" stroke="#e6e6e2" stroke-width="1"/>

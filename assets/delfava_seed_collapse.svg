<line x1="624.3" y1="108.0" x2="624.3" y2="406.0" stroke="#e6e6e2" stroke-width="1"/>
<line x1="707.1" y1="108.0" x2="707.1" y2="406.0" stroke="#e6e6e2" stroke-width="1"/>
<line x1="790.0" y1="108.0" x2="790.0" y2="406.0" stroke="#e6e6e2" stroke-width="1"/>
<text x="40.0" y="139.0" font-size="14" fill="#1f1f1f" text-anchor="start" font-weight="normal">Baselines</text>

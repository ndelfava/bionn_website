<circle cx="360.2" cy="310.0" r="5.5" fill="#5040ad" stroke="#fcfcfb" stroke-width="2"/>
<text x="962.0" y="315.0" font-size="14" fill="#1f1f1f" text-anchor="end" font-weight="normal">49.0% → 54.1%</text>
<line x1="40.0" y1="340.0" x2="962.0" y2="340.0" stroke="#e6e6e2" stroke-width="1"/>
<text x="40.0" y="368.0" font-size="14" fill="#454545" text-anchor="start" font-weight="bold">Spread of the</text>
<text x="40.0" y="386.0" font-size="14" fill="#454545" text-anchor="start" font-weight="bold">three regimes</text>
<line x1="613.9" y1="362.0" x2="743.0" y2="362.0" stroke="#b9b8b2" stroke-width="8" stroke-linecap="round"/>
<text x="962.0" y="367.0" font-size="14" fill="#1f1f1f" text-anchor="end" font-weight="normal">3 seeds: 7.8 pp</text>
<line x1="596.8" y1="388.0" x2="663.3" y2="388.0" stroke="#6f6e69" stroke-width="8" stroke-linecap="round"/>
<text x="962.0" y="393.0" font-size="14" fill="#1f1f1f" text-anchor="end" font-weight="normal">8 seeds: 4.0 pp</text>
<line x1="210.0" y1="406.0" x2="790.0" y2="406.0" stroke="#b4b3ad" stroke-width="1"/>
<text x="210.0" y="428.0" font-size="13" fill="#686868" text-anchor="middle" font-weight="normal">45%</text>
<text x="292.9" y="428.0" font-size="13" fill="#686868" text-anchor="middle" font-weight="normal">50%</text>
<text x="375.7" y="428.0" font-size="13" fill="#686868" text-anchor="middle" font-weight="normal">55%</text>
<text x="458.6" y="428.0" font-size="13" fill="#686868" text-anchor="middle" font-weight="normal">60%</text>
<text x="541.4" y="428.0" font-size="13" fill="#686868" text-anchor="middle" font-weight="normal">65%</text>
<text x="624.3" y="428.0" font-size="13" fill="#686868" text-anchor="middle" font-weight="normal">70%</text>
<text x="707.1" y="428.0" font-size="13" fill="#686868" text-anchor="middle" font-weight="normal">75%</text>
<text x="790.0" y="428.0" font-size="13" fill="#686868" text-anchor="middle" font-weight="normal">80%</text>
<text x="500.0" y="452.0" font-size="14" fill="#454545" text-anchor="middle" font-weight="normal">Solve rate at 13x13</text>
</svg>

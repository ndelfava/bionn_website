<circle cx="663.9" cy="134.0" r="6.5" fill="#fcfcfb"/><circle cx="663.9" cy="134.0" r="5.5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<circle cx="641.9" cy="134.0" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="962.0" y="139.0" font-size="14" fill="#1f1f1f" text-anchor="end" font-weight="normal">72.4% → 71.1%</text>
<text x="40.0" y="183.0" font-size="14" fill="#1f1f1f" text-anchor="start" font-weight="normal">Growing</text>
<line x1="743.0" y1="178.0" x2="651.2" y2="178.0" stroke="#eb6834" stroke-width="2" stroke-opacity="0.45"/>
<circle cx="743.0" cy="178.0" r="6.5" fill="#fcfcfb"/><circle cx="743.0" cy="178.0" r="5.5" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/>
<circle cx="651.2" cy="178.0" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="962.0" y="183.0" font-size="14" fill="#1f1f1f" text-anchor="end" font-weight="normal">77.2% → 71.6%</text>
<text x="40.0" y="227.0" font-size="14" fill="#1f1f1f" text-anchor="start" font-weight="normal">Shrinking</text>
<line x1="682.3" y1="222.0" x2="663.3" y2="222.0" stroke="#eb6834" stroke-width="2" stroke-opacity="0.45"/>
